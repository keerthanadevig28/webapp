name: Integration Tests CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: testdb
      DB_USER: testuser
      DB_PASSWORD: testpass
      S3_BUCKET_NAME: test-bucket
      AWS_REGION: us-east-1
      APP_HOST: 0.0.0.0
      APP_PORT: 8080

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-html pytest-cov httpx

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U testuser && break
            echo "Waiting for PostgreSQL... attempt $i"
            sleep 2
          done

      - name: Verify DB connection
        run: |
          python -c "
          import os
          import psycopg2
          conn = psycopg2.connect(
            host=os.environ['DB_HOST'],
            port=os.environ['DB_PORT'],
            dbname=os.environ['DB_NAME'],
            user=os.environ['DB_USER'],
            password=os.environ['DB_PASSWORD']
          )
          print('DB connection successful!')
          conn.close()
          "

      - name: Start application
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8080 > app.log 2>&1 &
          echo $! > app.pid
          sleep 15

      - name: Print app startup logs
        run: cat app.log || true

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/healthz)
            echo "Attempt $i — status: $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "503" ]; then
              echo "App is responding"
              break
            fi
            sleep 2
          done

      - name: Run all integration tests
        run: |
          pytest tests/ -v --cov=app

      - name: Show app logs on failure
        if: failure()
        run: cat app.log || true
