name: Packer Build

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'packer/**'
      - 'systemd/**'
      - 'requirements.txt'
      - '.github/workflows/packer-build.yml'

jobs:
  test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest tests/ -v --cov=app
        continue-on-error: false

  build-artifact:
    name: Build Application Artifact
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create application artifact
        run: |
          # Create a clean directory structure
          mkdir -p artifact
          
          # Copy application code
          cp -r app artifact/
          cp requirements.txt artifact/
          cp -r systemd artifact/
          
          # Create zip file
          cd artifact
          zip -r ../webapp.zip .
          cd ..
          
          # Verify zip was created
          ls -lh webapp.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-artifact
          path: webapp.zip
          retention-days: 1

  build-ami:
    name: Build AWS AMI
    runs-on: ubuntu-latest
    needs: build-artifact
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-artifact

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: 'latest'

      - name: Initialize Packer
        run: |
          cd packer
          packer init .

      - name: Build AMI
        run: |
          cd packer
          packer build \
            -var "aws_region=${{ secrets.AWS_REGION }}" \
            -var "aws_ami_users=[\"${{ secrets.AWS_DEMO_ACCOUNT_ID }}\"]" \
            -var "app_artifact=../webapp.zip" \
            -only='amazon-ebs.webapp' \
            .

      - name: Get AMI ID
        id: ami
        run: |
          AMI_ID=$(aws ec2 describe-images \
            --owners self \
            --query 'Images | sort_by(@, &CreationDate) | [-1].ImageId' \
            --output text)
          echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
          echo "Built AMI: $AMI_ID"

      - name: Share AMI with DEMO account
        run: |
          aws ec2 modify-image-attribute \
            --image-id ${{ steps.ami.outputs.ami_id }} \
            --launch-permission "Add=[{UserId=${{ secrets.AWS_DEMO_ACCOUNT_ID }}}]"

  build-gcp-image:
    name: Build GCP Image
    runs-on: ubuntu-latest
    needs: build-artifact
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-artifact

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: 'latest'

      - name: Initialize Packer
        run: |
          cd packer
          packer init .

      - name: Build GCP Image
        run: |
          cd packer
          packer build \
            -var "gcp_project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var "gcp_image_project=${{ secrets.GCP_DEMO_PROJECT_ID }}" \
            -var "app_artifact=../webapp.zip" \
            -only='googlecompute.webapp' \
            .

      - name: Get Image Name
        id: image
        run: |
          IMAGE_NAME=$(gcloud compute images list \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --filter="family:webapp" \
            --sort-by=~creationTimestamp \
            --limit=1 \
            --format="value(name)")
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "Built Image: $IMAGE_NAME"

      - name: Share image with DEMO project
        run: |
          gcloud compute images add-iam-policy-binding ${{ steps.image.outputs.image_name }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --member="serviceAccount:${{ secrets.GCP_DEMO_PROJECT_ID }}@cloudservices.gserviceaccount.com" \
            --role="roles/compute.imageUser"