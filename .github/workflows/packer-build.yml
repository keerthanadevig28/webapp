name: Packer Build

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: keerthanadevigovindaraj
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: webapp_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Set environment variables
        run: |
          echo "DB_HOST=localhost" >> $GITHUB_ENV
          echo "DB_PORT=5432" >> $GITHUB_ENV
          echo "DB_NAME=webapp_db" >> $GITHUB_ENV
          echo "DB_USER=keerthanadevigovindaraj" >> $GITHUB_ENV
          echo "DB_PASSWORD=password123" >> $GITHUB_ENV
          echo "APP_HOST=0.0.0.0" >> $GITHUB_ENV
          echo "APP_PORT=8080" >> $GITHUB_ENV

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -U keerthanadevigovindaraj -d webapp_db && break
            echo "Waiting for postgres..."
            sleep 1
          done

      - name: Start application in background
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8080 > app.log 2>&1 &
          echo $! > app.pid
          sleep 5

      - name: Check if app started
        run: |
          curl -f http://localhost:8080/healthz || (cat app.log && exit 1)

      - name: Run tests
        run: |
          pytest tests/ -v --cov=app
        continue-on-error: false

      - name: Stop application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
          fi

  build-artifact:
    name: Build Application Artifact
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create application artifact
        run: |
          mkdir -p artifact
          cp -r app artifact/
          cp requirements.txt artifact/
          mkdir -p artifact/systemd
          cp systemd/webapp.service artifact/systemd/
          cd artifact
          zip -r ../webapp.zip .
          cd ..
          ls -lh webapp.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-artifact
          path: webapp.zip
          retention-days: 1

  build-ami:
    name: Build AWS AMI
    runs-on: ubuntu-latest
    needs: build-artifact

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-artifact

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: 'latest'

      - name: Initialize Packer
        run: |
          cd packer
          packer init .

      - name: Build AMI
        run: |
          cd packer
          packer build \
            -var "aws_region=${{ secrets.AWS_REGION }}" \
            -var "aws_ami_users=[\"${{ secrets.AWS_DEMO_ACCOUNT_ID }}\"]" \
            -var "app_artifact=../webapp.zip" \
            -only='amazon-ebs.webapp' \
            .

  build-gcp-image:
    name: Build GCP Image
    runs-on: ubuntu-latest
    needs: build-artifact

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-artifact

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: 'latest'

      - name: Initialize Packer
        run: |
          cd packer
          packer init .

      - name: Build GCP Image
        run: |
          cd packer
          packer build \
            -var "gcp_project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var "app_artifact=../webapp.zip" \
            -only='googlecompute.webapp' \
            .

      - name: Share GCP Image with DEMO project
        run: |
          # Get the most recently built webapp image name
          IMAGE_NAME=$(gcloud compute images list \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --filter="family=webapp" \
            --sort-by="~creationTimestamp" \
            --limit=1 \
            --format="value(name)")

          echo "Sharing image: $IMAGE_NAME with DEMO project"

          # Get DEMO project number
          DEMO_PROJECT_NUMBER=$(gcloud projects describe ${{ secrets.GCP_DEMO_PROJECT_ID }} \
            --format="value(projectNumber)")

          echo "DEMO project number: $DEMO_PROJECT_NUMBER"

          # Grant compute image user role to DEMO project's default compute service account
          gcloud compute images add-iam-policy-binding $IMAGE_NAME \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --member="serviceAccount:${DEMO_PROJECT_NUMBER}-compute@developer.gserviceaccount.com" \
            --role="roles/compute.imageUser"

          echo "Image $IMAGE_NAME successfully shared with DEMO project"