name: Packer Build

on:
  pull_request:
    types:
      - closed
    branches:
      - main

# Only run when PR is actually merged, not just closed
env:
  IS_MERGED: ${{ github.event.pull_request.merged == true }}

jobs:
  test:
    if: github.event.pull_request.merged == true
    name: Run Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: keerthanadevigovindaraj
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: webapp_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Set environment variables
        run: |
          echo "DB_HOST=localhost" >> $GITHUB_ENV
          echo "DB_PORT=5432" >> $GITHUB_ENV
          echo "DB_NAME=webapp_db" >> $GITHUB_ENV
          echo "DB_USER=keerthanadevigovindaraj" >> $GITHUB_ENV
          echo "DB_PASSWORD=password123" >> $GITHUB_ENV
          echo "APP_HOST=0.0.0.0" >> $GITHUB_ENV
          echo "APP_PORT=8080" >> $GITHUB_ENV

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -U keerthanadevigovindaraj -d webapp_db && break
            echo "Waiting for postgres..."
            sleep 1
          done

      - name: Start application in background
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8080 > app.log 2>&1 &
          echo $! > app.pid
          sleep 5

      - name: Check if app started
        run: |
          curl -f http://localhost:8080/healthz || (cat app.log && exit 1)

      - name: Run tests
        run: |
          pytest tests/ -v --cov=app
        continue-on-error: false

      - name: Stop application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
          fi

  build-artifact:
    if: github.event.pull_request.merged == true
    name: Build Application Artifact
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create application artifact
        run: |
          mkdir -p artifact
          cp -r app artifact/
          cp requirements.txt artifact/
          mkdir -p artifact/systemd
          cp systemd/webapp.service artifact/systemd/
          cd artifact
          zip -r ../webapp.zip .
          cd ..
          ls -lh webapp.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-artifact
          path: webapp.zip
          retention-days: 1

  build-ami:
    if: github.event.pull_request.merged == true
    name: Build AWS AMI in DEV and Deploy to DEMO
    runs-on: ubuntu-latest
    needs: build-artifact

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-artifact

      - name: Configure AWS Credentials (DEV)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: 'latest'

      - name: Initialize Packer
        run: |
          cd packer
          packer init .

      - name: Build AMI in DEV and share with DEMO
        id: build_ami
        run: |
          cd packer
          packer build \
            -var "aws_region=us-east-1" \
            -var "aws_ami_users=[\"${{ secrets.AWS_DEMO_ACCOUNT_ID }}\"]" \
            -var "app_artifact=../webapp.zip" \
            -only='amazon-ebs.webapp' \
            . | tee packer_output.txt

          # Extract AMI ID from Packer output
          AMI_ID=$(grep -oP 'ami-[a-z0-9]+' packer_output.txt | tail -1)
          echo "AMI_ID=$AMI_ID" >> $GITHUB_ENV
          echo "Built AMI: $AMI_ID"

      - name: Reconfigure AWS CLI for DEMO account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEMO_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEMO_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Create new Launch Template version with latest AMI
        run: |
          aws ec2 create-launch-template-version \
            --launch-template-name csye6225_asg \
            --source-version '$Latest' \
            --launch-template-data "{\"ImageId\":\"${{ env.AMI_ID }}\"}"
          echo "Launch template updated with AMI: ${{ env.AMI_ID }}"

      - name: Update ASG to use latest Launch Template version
        run: |
          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name csye6225-webapp-asg \
            --launch-template "LaunchTemplateName=csye6225_asg,Version=\$Latest"
          echo "ASG updated to use \$Latest launch template version"

      - name: Start Instance Refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name csye6225-webapp-asg \
            --query 'InstanceRefreshId' \
            --output text)
          echo "REFRESH_ID=$REFRESH_ID" >> $GITHUB_ENV
          echo "Instance refresh started: $REFRESH_ID"

      - name: Wait for Instance Refresh to complete
        run: |
          echo "Waiting for instance refresh ${{ env.REFRESH_ID }} to complete..."
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name csye6225-webapp-asg \
              --instance-refresh-ids ${{ env.REFRESH_ID }} \
              --query 'InstanceRefreshes[0].Status' \
              --output text)
            echo "Current status: $STATUS"
            if [ "$STATUS" = "Successful" ]; then
              echo "Instance refresh completed successfully!"
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Instance refresh failed with status: $STATUS"
              exit 1
            fi
            sleep 30
          done
