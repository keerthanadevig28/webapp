name: Packer Validate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packer/**'
      - 'systemd/**'
      - '.github/workflows/packer-validate.yml'

jobs:
  validate:
    name: Validate Packer Template
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create dummy files for validation
        run: |
          # Create dummy webapp.zip in root
          echo "dummy" > webapp.zip
          
          # Create systemd directory and file if not exists
          mkdir -p systemd
          if [ ! -f systemd/webapp.service ]; then
            echo "dummy" > systemd/webapp.service
          fi
          
          # Create packer/scripts directory and file if not exists
          mkdir -p packer/scripts
          if [ ! -f packer/scripts/setup.sh ]; then
            echo "#!/bin/bash" > packer/scripts/setup.sh
            chmod +x packer/scripts/setup.sh
          fi
          
          # Verify files exist
          ls -la webapp.zip
          ls -la systemd/webapp.service
          ls -la packer/scripts/setup.sh

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: 'latest'

      - name: Initialize Packer
        run: |
          cd packer
          packer init .

      - name: Format check
        run: |
          cd packer
          packer fmt -check .
        continue-on-error: false

      - name: Validate Packer template
        run: |
          cd packer
          packer validate \
            -var "aws_region=us-east-1" \
            -var "gcp_project_id=dummy-project" \
            -var "gcp_image_project=[]" \
            -var "aws_ami_users=[]" \
            -var "app_artifact=../webapp.zip" \
            .
