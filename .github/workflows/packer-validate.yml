name: Packer Validate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packer/**'
      - '.github/workflows/packer-validate.yml'

jobs:
  validate:
    name: Validate Packer Template
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: 'latest'

      - name: Initialize Packer
        run: |
          cd packer
          packer init .

      - name: Format check
        run: |
          cd packer
          packer fmt -check .
        continue-on-error: false

      - name: Validate Packer template
        run: |
          cd packer
          packer validate \
            -var "aws_region=${{ secrets.AWS_REGION }}" \
            -var "gcp_project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var "gcp_image_project=${{ secrets.GCP_DEMO_PROJECT_ID }}" \
            -var "aws_ami_users=[\"${{ secrets.AWS_DEMO_ACCOUNT_ID }}\"]" \
            .

      - name: Comment PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Packer validation failed. Please check the workflow logs.'
            })