name: Packer Validate

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Packer Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create dummy files for validation
        run: |
          echo "dummy" > webapp.zip
          mkdir -p systemd
          if [ ! -f systemd/webapp.service ]; then
            echo "[Unit]" > systemd/webapp.service
            echo "Description=Dummy" >> systemd/webapp.service
          fi
          mkdir -p packer/scripts
          if [ ! -f packer/scripts/setup.sh ]; then
            echo "#!/bin/bash" > packer/scripts/setup.sh
            echo "echo dummy" >> packer/scripts/setup.sh
            chmod +x packer/scripts/setup.sh
          fi

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: 'latest'

      - name: Initialize Packer
        run: |
          cd packer
          packer init .

      - name: Format check
        run: |
          cd packer
          packer fmt -check .
        continue-on-error: false

      - name: Validate Packer template
        run: |
          cd packer
          packer validate \
            -var "aws_region=us-east-1" \
            -var "gcp_project_id=dummy-project" \
            -var "gcp_image_project=[]" \
            -var "aws_ami_users=[]" \
            -var "app_artifact=../webapp.zip" \
            .