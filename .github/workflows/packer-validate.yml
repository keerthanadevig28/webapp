name: Packer Validate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packer/**'
      - '.github/workflows/packer-validate.yml'

jobs:
  validate:
    name: Validate Packer Template
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: 'latest'

      - name: Initialize Packer
        run: |
          cd packer
          packer init .

      - name: Format check
        run: |
          cd packer
          packer fmt -check .
        continue-on-error: false

      - name: Create dummy files for validation
        run: |
          # Create dummy webapp.zip for validation
          touch webapp.zip

      - name: Validate Packer template
        run: |
          cd packer
          packer validate \
            -var "aws_region=us-east-1" \
            -var "gcp_project_id=csye6225-dev-487102" \
            -var "gcp_image_project=[]" \
            -var "aws_ami_users=[]" \
            -var "app_artifact=../webapp.zip" \
            .
